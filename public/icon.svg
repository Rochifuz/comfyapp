<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Ícono de la app (manifest.json + accesos directos). Es SVG y no
         PNG a propósito: no había forma de generar imágenes rasterizadas
         en este entorno, y un SVG simple como este se ve nítido en
         cualquier tamaño. Si en algún momento hace falta mejor soporte en
         iOS viejo (que prefiere PNG), se puede exportar este mismo dibujo
         a PNG con cualquier conversor online y agregarlo aparte. -->
    <rect width="512" height="512" rx="108" fill="#0f0e0c"/>
    <text x="256" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="300"
        font-weight="700" text-anchor="middle" fill="#d4af37">$</text>
</svg>
